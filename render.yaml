# Render Blueprint for PocketPro:NYL (Chroma + backend + static frontend).
# Render dashboard -> New -> Blueprint -> pick this repo. Fill the "sync: false"
# secrets when prompted. Disks need a paid plan. See DEPLOY.md.
services:
  - type: pserv
    name: pocketpro-nyl-chroma
    runtime: image
    image:
      url: docker.io/chromadb/chroma:0.5.3
    plan: starter
    region: oregon
    envVars:
      - key: IS_PERSISTENT
        value: "TRUE"
      - key: ANONYMIZED_TELEMETRY
        value: "FALSE"
    disk:
      name: chroma-data
      mountPath: /chroma/chroma
      sizeGB: 10

  - type: web
    name: pocketpro-nyl-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PORT
        value: "5000"
      - key: DATA_DIR
        value: /data
      - key: PREDICTION_ENGINE
        value: modular
      - key: PREDICTION_STATE_DIR
        value: /data/prediction
      - key: CHROMA_SDK_ENABLED
        value: "1"
      - key: CHROMA_HOST
        fromService:
          type: pserv
          name: pocketpro-nyl-chroma
          property: host
      - key: CHROMA_PORT
        value: "8000"
      - key: AUTH_MODE
        value: "off"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CHAT_GPT_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
    disk:
      name: nyl-data
      mountPath: /data
      sizeGB: 20

  - type: web
    name: pocketpro-nyl-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: REACT_APP_API_BASE
        value: ""
    routes:
      # Same-origin /api like the nginx proxy. Change the host if Render gives
      # the backend a different onrender.com URL.
      - type: rewrite
        source: /api/*
        destination: https://pocketpro-nyl-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
