# Fly.io template for the PocketPro:NYL backend only (alternative to render.yaml).
# The backend needs a Chroma server: run chromadb/chroma:0.5.3 as a second Fly app
# named pocketpro-nyl-chroma with a volume on /chroma/chroma.
# The Dockerfile expects ./backend as build context:
#   fly volumes create nyl_data --size 20 --region iad -a pocketpro-nyl-backend
#   fly secrets set GEMINI_API_KEY=... OPENAI_API_KEY=... -a pocketpro-nyl-backend
#   fly deploy backend --config fly.toml
app = "pocketpro-nyl-backend"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  DATA_DIR = "/data"
  PREDICTION_ENGINE = "modular"
  PREDICTION_STATE_DIR = "/data/prediction"
  CHROMA_SDK_ENABLED = "1"
  CHROMA_HOST = "pocketpro-nyl-chroma.internal"
  CHROMA_PORT = "8000"
  AUTH_MODE = "off"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "90s"

[[vm]]
  memory = "2gb"

[[mounts]]
  source = "nyl_data"
  destination = "/data"
