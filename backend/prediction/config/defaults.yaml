# Global defaults for the modular prediction engine.
ensemble:
  enabled: true
  learning_rate: 0.05
  min_weight: 0.01

nn:
  enabled: true
  # Prefer the recurrent sequence model; the engine falls back to MLP when
  # TensorFlow is not installed or LSTM fitting fails.
  backend: lstm
  lookback: 30
  blend_weight: 0.15
  hidden_layers: [64, 32]
  max_iter: 200

metrics:
  backtest_window: 200
  min_backtest_draws: 50
  random_trials: 500
  target_accuracy: 0.98
  verification_rounds: 1

strategies:
  hot_cold:
    hot_window: 20
    cold_window: 100