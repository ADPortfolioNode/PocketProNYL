# PocketProNYL local stack
# Host ports default to Windows-safe loopback: 3000 / 5001 / 8001
# Override with FRONTEND_HOST_PORT, BACKEND_HOST_PORT, CHROMA_HOST_PORT in .env

services:
  backend:
    container_name: pocketpro_nyl_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CACHE_BUSTER: ${BACKEND_CACHE_BUSTER:-stable}
    ports:
      - "${DOCKER_BIND_HOST:-127.0.0.1}:${BACKEND_HOST_PORT:-5001}:5000"
    environment:
      - DATA_DIR=/data
      - MAX_CONCURRENT_CLONES=3
      - CHROMA_SDK_ENABLED=1
      - HOME=/app
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHAT_GPT_API_KEY=${CHAT_GPT_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROK_API_KEY=${GROK_API_KEY}
      - GROK_API_BASE=${GROK_API_BASE:-https://api.x.ai/v1}
      - GROK_MODEL=${GROK_MODEL:-grok-3-mini-beta}
      - CHROMA_HOST=pocketpro_nyl_chroma
      - HF_HOME=/app/.cache/chroma
      - CHROMA_PORT=8000
      - INGEST_BATCH_SIZE=6000
      - INGEST_REQUEST_TIMEOUT=30
      - INGEST_MAX_RETRIES=3
      - INGEST_RETRY_DELAY=1
      - INGEST_BATCH_MAX_RETRIES=2
      - INGEST_PROGRESS_INTERVAL_S=0.5
      - INGEST_STATE_SAVE_INTERVAL_S=2
      - INGEST_STARTUP_COUNT_WORKERS=1
      - INGEST_STARTUP_PARALLEL=1
      - INGEST_ENABLE_CATALOG_FALLBACK=1
      - INGEST_MAX_CATALOG_CANDIDATES=3
      - INGEST_SKIP_FETCH_THRESHOLD=50000
      - INGEST_FAST_COMPLETE_POPULATED=1
      - INGEST_STARTUP_BATCH_SIZE=${INGEST_STARTUP_BATCH_SIZE:-500}
      - INGEST_STARTUP_BATCH_MAX_RETRIES=${INGEST_STARTUP_BATCH_MAX_RETRIES:-5}
      - INGEST_QUICK_COMPLETE_THRESHOLD=${INGEST_QUICK_COMPLETE_THRESHOLD:-1000}
      - PREDICTION_ENGINE=modular
      - PREDICTION_HOT_WINDOW=${PREDICTION_HOT_WINDOW:-50}
      - PREDICTION_COLD_WINDOW=${PREDICTION_COLD_WINDOW:-200}
      - PREDICTION_HOT_WEIGHT=${PREDICTION_HOT_WEIGHT:-0.7}
      - PREDICTION_COLD_WEIGHT=${PREDICTION_COLD_WEIGHT:-0.3}
      - PREDICTION_STATE_DIR=/data/prediction
      - TRAIN_TARGET_ACCURACY=0.99
      - TRAIN_MAX_ATTEMPTS=40
      - TRAIN_SIZE=0.33
      - TRAIN_N_ESTIMATORS=250
      - TRAIN_MAX_DEPTH=18
      - TRAIN_RANDOM_STATE=42
      - TRAIN_BLEND_STEP=0.05
      - TRAIN_DATA_LIMIT=0
      - TRAIN_WINDOW_SIZE=3
      - TRAIN_AUTO_TUNE=1
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      chroma:
        condition: service_healthy
    command: sh -c "exec hypercorn main:app --bind 0.0.0.0:5000 --workers 1"
    volumes:
      - backend_data:/data
      - chroma_model_cache:/app/.cache/chroma
    networks:
      - pocketpro-nyl-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0) if urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=2).getcode() == 200 else exit(1)"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 600s
    restart: unless-stopped
    user: "root"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 22.13.1
        REACT_APP_API_BASE: ""
        CACHE_BUSTER: ${FRONTEND_CACHE_BUSTER:-20260822}
    container_name: pocketpro_nyl_frontend
    ports:
      - "${DOCKER_BIND_HOST:-127.0.0.1}:${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - HOME=/app
      - CHOKIDAR_USEPOLLING=true
      - UPDATE_BROWSERSLIST_DB=0
      - REACT_APP_API_BASE=
    networks:
      - pocketpro-nyl-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.5.3
    container_name: pocketpro_nyl_chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "${DOCKER_BIND_HOST:-127.0.0.1}:${CHROMA_HOST_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
    networks:
      - pocketpro-nyl-net
    restart: on-failure

networks:
  pocketpro-nyl-net:
    driver: bridge

volumes:
  backend_data:
  chroma_data:
  chroma_model_cache:
