# PocketProNYL local stack
# Publish on 0.0.0.0 so Docker Desktop (Windows/WSL2) creates a real host listener.

services:
  backend:
    container_name: pocketpro_nyl_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CACHE_BUSTER: ${BACKEND_CACHE_BUSTER:-stable}
        SKIP_ONNX: "1"
    ports:
      - "${DOCKER_BIND_HOST:-0.0.0.0}:${BACKEND_HOST_PORT:-5001}:5000"
    environment:
      - DATA_DIR=/data
      - MAX_CONCURRENT_CLONES=3
      - CHROMA_SDK_ENABLED=1
      - HOME=/app
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHAT_GPT_API_KEY=${CHAT_GPT_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROK_API_KEY=${GROK_API_KEY}
      - GROK_API_BASE=${GROK_API_BASE:-https://api.x.ai/v1}
      - GROK_MODEL=${GROK_MODEL:-grok-3-mini-beta}
      - CHROMA_HOST=pocketpro_nyl_chroma
      - HF_HOME=/app/.cache/chroma
      - CHROMA_PORT=8000
      - INGEST_STARTUP_COUNT_WORKERS=1
      - INGEST_STARTUP_PARALLEL=1
      - INGEST_ENABLE_CATALOG_FALLBACK=0
      - INGEST_MAX_ROWS_PER_GAME=80000
      - INGEST_STARTUP_BATCH_SIZE=500
      - PREDICTION_ENGINE=modular
      - PREDICTION_STATE_DIR=/data/prediction
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      chroma:
        condition: service_healthy
    command: sh -c "exec hypercorn main:app --bind 0.0.0.0:5000 --workers 1"
    volumes:
      - backend_data:/data
      - chroma_model_cache:/app/.cache/chroma
    networks:
      - pocketpro-nyl-net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',5000),2); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    user: "root"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 22.13.1
        REACT_APP_API_BASE: ""
        CACHE_BUSTER: ${FRONTEND_CACHE_BUSTER:-20260823d}
    container_name: pocketpro_nyl_frontend
    ports:
      - "${DOCKER_BIND_HOST:-0.0.0.0}:${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    environment:
      - HOME=/app
      - REACT_APP_API_BASE=
    networks:
      - pocketpro-nyl-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.5.3
    container_name: pocketpro_nyl_chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "${DOCKER_BIND_HOST:-0.0.0.0}:${CHROMA_HOST_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
    networks:
      - pocketpro-nyl-net
    restart: on-failure

networks:
  pocketpro-nyl-net:
    driver: bridge

volumes:
  backend_data:
  chroma_data:
  chroma_model_cache:
