# =============================================================================
# Mensa Project - Local development Docker Compose
# =============================================================================
# Public web-server / subscriber deployment:
#   cp .env.production.example .env && ./scripts/deploy-production.sh
#   See docs/deployment/PUBLIC_DISTRIBUTION.md
#
# Safer local bind (loopback only):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  backend:
    container_name: mensa_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CACHE_BUSTER: ${BACKEND_CACHE_BUSTER:-stable}
    ports:
      - "${DOCKER_BIND_HOST:-0.0.0.0}:${BACKEND_HOST_PORT:-5000}:5000"
    environment:
      - DATA_DIR=/data
      - MAX_CONCURRENT_CLONES=3
      - CHROMA_SDK_ENABLED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHAT_GPT_API_KEY=${CHAT_GPT_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROK_API_KEY=${GROK_API_KEY}
      - GROK_API_BASE=${GROK_API_BASE:-https://api.x.ai/v1}
      - GROK_MODEL=${GROK_MODEL:-grok-3-mini-beta}
      - CHROMA_HOST=mensa_chroma
      - HF_HOME=/root/.cache/chroma # For ChromaDB client embedding models, mounted to volume
      - CHROMA_PORT=8000
      - INGEST_BATCH_SIZE=6000
      - INGEST_REQUEST_TIMEOUT=30
      - INGEST_MAX_RETRIES=3
      - INGEST_RETRY_DELAY=1
      - INGEST_BATCH_MAX_RETRIES=2
      - INGEST_PROGRESS_INTERVAL_S=0.5
      - INGEST_STATE_SAVE_INTERVAL_S=2
      - INGEST_STARTUP_COUNT_WORKERS=4
      - INGEST_STARTUP_PARALLEL=1
      - INGEST_ENABLE_CATALOG_FALLBACK=0
      - INGEST_MAX_CATALOG_CANDIDATES=3
      - INGEST_SKIP_FETCH_THRESHOLD=50000
      - INGEST_FAST_COMPLETE_POPULATED=1
      - PREDICTION_ENGINE=modular
      - PREDICTION_STATE_DIR=/data/prediction
      - TRAIN_TARGET_ACCURACY=0.90
      - TRAIN_MAX_ATTEMPTS=40
      - TRAIN_SIZE=0.25
      - TRAIN_N_ESTIMATORS=250
      - TRAIN_MAX_DEPTH=18
      - TRAIN_RANDOM_STATE=42
      - TRAIN_BLEND_STEP=0.05
      - TRAIN_DATA_LIMIT=0
      - TRAIN_WINDOW_SIZE=3
      - TRAIN_AUTO_TUNE=1
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      chroma:
        condition: service_healthy
    volumes:
      - backend_data:/data
      # Persist the ChromaDB ONNX embedding model cache so the 79 MB
      # all-MiniLM-L6-v2 download does not block HTTP endpoints on every restart
      - chroma_model_cache:/root/.cache/chroma
    networks:
      - mensa-net
    healthcheck:
      # Use HTTP probe (not TCP) so 'healthy' truly means the API is serving.
      # TCP becomes available before Hypercorn finishes startup; HTTP does not.
      test: [
        "CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"
      ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s # Reverted to 120s to allow more time for backend initialization
    deploy:
      resources:
        limits:
          memory: 6G
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 22.13.1
        REACT_APP_API_BASE: ""
        CACHE_BUSTER: ${FRONTEND_CACHE_BUSTER:-20260703b}
    container_name: mensa_frontend
    ports:
      - "${DOCKER_BIND_HOST:-0.0.0.0}:${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - HOME=/app
      - CHOKIDAR_USEPOLLING=true
    networks:
      - mensa-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"] # More robust than curl -f
      interval: 15s # Check more frequently
      timeout: 5s   # Fail faster
      retries: 5    # Allow more transient failures before marking unhealthy
      start_period: 10s # Frontend should be quick to serve static files
    restart: unless-stopped
  chroma:
    image: chromadb/chroma:0.5.3
    container_name: mensa_chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "${DOCKER_BIND_HOST:-0.0.0.0}:${CHROMA_HOST_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s # Reduced from 120s, ChromaDB should start quickly
    networks:
      - mensa-net
    restart: on-failure

networks:
  mensa-net:
    driver: bridge

volumes:
  backend_data:
  chroma_data:
  chroma_model_cache:
